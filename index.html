<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Muvit – Mobilität für Magdeburg</title>
  <meta name="description" content="Muvit: Verbindungen, Abfahrten in Echtzeit, Fahrtverlauf, Live-Karte und Assistance (KI) für Magdeburg und ganz Deutschland.">
  <meta name="theme-color" content="#131418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muvit">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/muvit.css">
</head>
<body>
  <div id="app">
    <!-- Karte im Hintergrund -->
    <div id="map" aria-label="Karte"></div>
    <button class="map-btn" id="locateBtn" aria-label="Mein Standort"></button>

    <!-- Hauptframe: frei ziehbares Sheet über der Karte -->
    <section class="sheet" id="sheet" aria-live="polite">
      <div class="grab" id="sheetGrab"><span></span></div>
      <header class="sheet-head" id="sheetHead"></header>
      <div class="head-extra" id="sheetExtra" hidden></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <!-- Untere Leiste: Auskunft, Tickets, D-Ticket, Mehr -->
    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>

    <!-- Überwachte Verbindung / Hinweis „Anschluss wird nicht erreicht“ -->
    <div class="watch-bar" id="watchBar" hidden></div>

    <div class="toasts" id="toasts" aria-live="assertive"></div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif;color:#fff">Muvit benötigt JavaScript.</p></noscript>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tariffs.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/watch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
