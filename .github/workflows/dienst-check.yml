# Muvit-Dienst prüfen: fragt den laufenden Dienst mit echten Daten ab (DB Hauptbahnhof, MVB Alter Markt,
# Störungen, Wagenreihung) und zeigt eine Übersicht im Protokoll. Startbar unter Actions → „Run workflow“.
name: Muvit-Dienst prüfen

on:
  workflow_dispatch:
  push:
    paths: ['service/scripts/smoke.mjs', '.github/workflows/dienst-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Echte Daten abfragen
        run: |
          URL=$(node -p 'require("./config.json").service' 2>/dev/null || true)
          if [ -z "$URL" ] || [ "$URL" = "undefined" ]; then echo "::warning::config.json enthält keine Adresse – zuerst „Muvit-Dienst bereitstellen“ starten."; exit 0; fi
          node service/scripts/smoke.mjs "$URL"
